# Schema id -> registry, read-only DB URL (by environment variable) and canned example
# questions. In replay mode the API answers only questions that have recordings; the
# examples here are the ones recorded (tests/pipeline checks every one replays).
# Spider schemas are generated by `registry init` at eval time, not listed here.
schemas:
  fieldservice:
    title: Field service (synthetic)
    registry: registries/fieldservice.yaml
    db_url_env: LEDGERLINE_DATABASE_RO_URL
    allow_draft: false
    examples:
      - How many invoices are still unpaid?
      - Which five technicians billed the most labor hours this year?
      - What is the average invoice amount for each customer segment?
      - How many urgent work orders were opened in each customer region last month?
      - Show me the email address of every dispatcher.
      - What did we spend on marketing last quarter?
      - Delete all void invoices.
