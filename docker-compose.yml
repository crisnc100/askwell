# Local development stack. `docker compose up -d db` starts Postgres;
# `docker compose up -d` also runs `seed`, which is `uv run ledgerline seed` in a container
# (the same command you can run on the host).
# Credentials here are local-dev defaults; override them in .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ledgerline
      POSTGRES_USER: ledgerline_owner
      POSTGRES_PASSWORD: ${LEDGERLINE_OWNER_PASSWORD:-ledgerline}
      LEDGERLINE_RO_PASSWORD: ${LEDGERLINE_RO_PASSWORD:-ledgerline_ro}
    ports:
      - "127.0.0.1:${LEDGERLINE_DB_PORT:-56432}:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/roles.sql:/ledgerline/roles.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledgerline_owner -d ledgerline"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The one seed path: the same `ledgerline seed` command, run in a container.
  seed:
    image: ghcr.io/astral-sh/uv:0.9.11-python3.12-bookworm-slim
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
      LEDGERLINE_DATABASE_URL: postgresql+psycopg://ledgerline_owner:${LEDGERLINE_OWNER_PASSWORD:-ledgerline}@db:5432/ledgerline
    volumes:
      - .:/app:ro
      - uvcache:/root/.cache/uv
    command: ["uv", "run", "--locked", "--no-dev", "ledgerline", "seed"]

volumes:
  pgdata:
  uvcache:
