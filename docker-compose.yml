# Local development stack. `docker compose up -d db` starts Postgres;
# `docker compose up -d` also runs `seed`, which is `uv run askwell seed` in a container
# (the same command you can run on the host).
# Credentials here are local-dev defaults; override them in .env.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: askwell
      POSTGRES_USER: askwell_owner
      POSTGRES_PASSWORD: ${ASKWELL_OWNER_PASSWORD:-askwell}
      ASKWELL_RO_PASSWORD: ${ASKWELL_RO_PASSWORD:-askwell_ro}
    ports:
      - "127.0.0.1:${ASKWELL_DB_PORT:-56432}:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./infra/postgres/roles.sql:/askwell/roles.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askwell_owner -d askwell"]
      interval: 2s
      timeout: 5s
      retries: 30

  # The one seed path: the same `askwell seed` command, run in a container.
  seed:
    image: ghcr.io/astral-sh/uv:0.9.11-python3.12-bookworm-slim
    depends_on:
      db:
        condition: service_healthy
    working_dir: /app
    environment:
      UV_PROJECT_ENVIRONMENT: /venv
      UV_LINK_MODE: copy
      ASKWELL_DATABASE_URL: postgresql+psycopg://askwell_owner:${ASKWELL_OWNER_PASSWORD:-askwell}@db:5432/askwell
    volumes:
      - .:/app:ro
      - uvcache:/root/.cache/uv
    command: ["uv", "run", "--locked", "--no-dev", "askwell", "seed"]

volumes:
  pgdata:
  uvcache:
