# The hosted beta on one host, behind Caddy. See "Deploy the hosted beta" in the README.
#   docker compose -f compose.prod.yaml up -d --build
# Settings come from .env.beta next to this file (never committed; see .env.beta.example).
# The ${LEDGERLINE_PORT} fallback keeps a pre-0.2.0 port setting working for one release.
services:
  app:
    build: .
    image: askwell:beta
    restart: unless-stopped
    # A runaway request cannot take the whole host with it.
    mem_limit: 1g
    env_file: .env.beta
    environment:
      # Caddy on the same host is the only client, and it writes X-Forwarded-For.
      ASKWELL_TRUST_PROXY: "1"
      # Named links failed their gate (ADR-008, seen checks in PR-2); off, questions
      # across two links between the same tables are refused as before.
      ASKWELL_FEATURES_OFF: "link_roles"
    ports:
      # Only Caddy on this host can reach the app.
      - "127.0.0.1:${ASKWELL_PORT:-${LEDGERLINE_PORT:-8000}}:8000"
    volumes:
      - askwell-data:/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Deletes expired workspaces once an hour (the cron job the README describes).
  sweep:
    image: askwell:beta
    restart: unless-stopped
    env_file: .env.beta
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - askwell-data:/data
    command: ["sh", "-c", "umask 077 && while true; do askwell sweep; sleep 3600; done"]

volumes:
  askwell-data:
