# The two demo questions mistral-small missed when the demo was re-recorded. They are
# not benchmark items; they were dropped from config/schemas.yaml (see builds/v01/log.md).
demo-top-technicians:
  note: '"Which five technicians billed the most labor hours this year?" The first intent counted from
    technicians as a row list with metrics (intent_shape, unknown_field, fan_out). The retry refused,
    saying the join would double count. Summing work order hours grouped by technician answers it.'
  tag: misread
demo-urgent-by-region:
  note: '"How many urgent work orders were opened in each customer region last month?" Both intents had
    a placeholder reason ("None"), no group_by, and a sort on customer__region (intent_shape, invalid_order_by).
    Grouping work orders by the customer region answers it.'
  tag: misread
