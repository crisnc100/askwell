# Triage of every Ledgerline miss on the field service schema. Each note names the model
# and run it describes:
# - the held-out questions (ho-*) in v02-holdout-before (v0.1 grammar) and v02-holdout
#   (v0.2 grammar), Claude Haiku 5.5, 3 trials each;
# - the seen questions (fs-*) in v02-seen (v0.2 grammar), and before that in
#   select-haiku-2026-11-11 (Claude Haiku 5.5) and select-2026-11-11 (mistral-small, the
#   previous default). Other models in select-2026-11-11 missed some of the same questions
#   in other ways.
# Where several runs missed an item, the tag is the latest run's. The triage of the
# simulated run sim-1 is kept in evals/reports/sim-1.md.
# Tags: grammar_gap | misread | validator_false_reject | builder_bug | gold_issue.
#
# "Placeholder reason" below means the model put "", "none" or "None" in
# unanswerable_reason on an intent that is not a refusal. The validator rejects any
# value there, as the grammar says, so such an intent fails even when the rest is right.
fs-009:
  note: 'mistral-small (select-2026-11-11): The first intent was right except for a placeholder reason.
    On the retry the model said the registry has no technician names, which is wrong (full_name is visible).'
  tag: misread
fs-011:
  note: 'mistral-small (select-2026-11-11): Asked for the most expensive part and its price, the model
    returned the highest price and a count, not the part. A row list sorted by price with a limit of 1
    would answer it.'
  tag: misread
fs-018:
  note: 'mistral-small (select-2026-11-11): Both intents had a placeholder reason, no group_by, and a
    sort on an issued_at_month field that does not exist. A monthly group on issued_at would answer it.'
  tag: misread
fs-020:
