# The minimum scores v0.1 set out to reach, checked by the eval report for Askwell.
# The report computes met / not met from the numbers. `status_note`, `cause` and `next`
# are the written explanation for the current release. An entry with a `gold` file
# checks only runs on that file; one without checks the schema's own gold.
fieldservice:
  floors:
    execution_accuracy: {min: 0.80}
    wrong_answer_rate_given_answered: {max: 0.05}
  status_note: in v0.2 on the seen questions (live, default model)
  cause: >-
    Seen questions: v0.2 was designed from two of them (fs-028, fs-035), so this is not
    the headline. In v02-seen (3 trials) accuracy is 111 of 129 (86.0%) and wrong
    answers are 2 of 113 answered (1.8%). fs-028, fs-035 and fs-041 are right in every
    trial. Of the misses, 15 are correct refusals of questions v0.2 still cannot express,
    2 are misreads and 1 is a question that can be read with either of two dates. v0.1
    (select-haiku-2026-11-11, 1 trial) had 2 wrong of 37 answered (5.4%).
  next: >-
    The held-out result (v02-holdout) is the headline. The v0.2 prompt and grammar are not
    changed after seeing these results.
fieldservice-held-out:
  schema: fieldservice
  gold: holdout-v02.jsonl
  floors:
    execution_accuracy: {min: 0.80}
    wrong_answer_rate_given_answered: {max: 0.05}
  status_note: on the held-out questions (live, default model)
  cause: >-
    Held-out questions, written before any v0.2 code. v0.2 (v02-holdout, 3 trials) is
    right on 40 of 84 and wrong on 14 of 54 answered (25.9%); v0.1 (v02-holdout-before)
    was right on 12 of 84 and wrong on 37 of 49 (75.5%). Of v0.2's 14 wrong answers, 6
    give the right names and values but the gold also returns an id column (ho-020,
    ho-024); 3 do the same and also pick another tied technician for fifth place
    (ho-028); 3 differ only in the order of tied rows (ho-022); 2 are a misread (ho-010).
    Most of the shortfall in accuracy is 10 questions v0.2 cannot express
    (durations, products of fields, "has none", distinct periods, a subquery), refused in
    every trial.
  next: >-
    The held-out golds keep their id-column convention, fixed before the runs. The v0.2
    prompt and grammar are not changed after seeing these results.
