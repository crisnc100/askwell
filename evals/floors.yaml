# The minimum scores v0.1 set out to reach, checked by the eval report for Ledgerline.
# The report computes met / not met from the numbers. `status_note`, `cause` and `next`
# are the written explanation for the current release.
fieldservice:
  floors:
    execution_accuracy: {min: 0.80}
    wrong_answer_rate_given_answered: {max: 0.05}
  status_note: in v0.1 (live, default model)
  cause: >-
    Most misses are refusals. 16 of the 43 answerable questions end in one: 12 because
    the model's intent failed validation twice (most often a malformed intent shape, or a
    sort on a field that is neither a metric nor a group), and 4 because the model judged
    the question unanswerable. Eight questions need things the intent grammar cannot
    express, so no model can score above 81.4%. Of the 27 answers given, 6 are wrong.
  next: >-
    v0.2 changes the prompt and the grammar, then measures them on a fresh run. The v0.1
    prompt is not changed after seeing these results.
