name: verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16
        env:
          POSTGRES_DB: askwell
          POSTGRES_USER: askwell_owner
          POSTGRES_PASSWORD: askwell  # pragma: allowlist secret (local CI-only DB credential)
        ports:
          - 56432:5432
        options: >-
          --health-cmd "pg_isready -U askwell_owner -d askwell"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      ASKWELL_DATABASE_URL: postgresql+psycopg://askwell_owner:askwell@localhost:56432/askwell  # pragma: allowlist secret (local CI-only DB credential)
      ASKWELL_DATABASE_RO_URL: postgresql+psycopg://askwell_ro:askwell_ro@localhost:56432/askwell  # pragma: allowlist secret (local CI-only DB credential)
      ASKWELL_APP_DATABASE_URL: postgresql+psycopg://askwell_owner:askwell@localhost:56432/askwell_app  # pragma: allowlist secret (local CI-only DB credential)
      ASKWELL_LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.11"
      - name: Create roles (same script compose runs at init)
        env:
          PGPASSWORD: askwell
          ASKWELL_RO_PASSWORD: askwell_ro  # pragma: allowlist secret (local CI-only DB credential)
        run: |
          psql -h localhost -p 56432 -U askwell_owner -d askwell \
            -v ro_password="$ASKWELL_RO_PASSWORD" -f infra/postgres/roles.sql
      - name: Cache the Spider archive (checksum-pinned)
        uses: actions/cache@v4
        with:
          path: data/downloads
          key: spider-00636695dabed6b5f4b8328a16b13e069a2f16591d5efcce57660669c85b121b
      - name: Fetch Spider (verifies the pinned checksum; data stays untracked)
        run: uv run python -m scripts.fetch_benchmarks
      - name: Seed (the one seed path)
        run: uv run askwell seed
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache Playwright's browser (keyed by the locked Playwright version)
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('web/package-lock.json') }}
      - name: Install the browser the web tests use
        run: |
          cd web
          npm ci
          npx playwright install --with-deps chromium
      - name: verify.sh
        run: ./verify.sh
